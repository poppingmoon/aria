dependency_overrides:
  flutter_inappwebview_macos:
    git:
      url: https://github.com/poppingmoon/flutter_inappwebview
      ref: f7b5730d0c8c203574c16abc992cd13d1add3eba
      path: flutter_inappwebview_macos

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - l10n-main
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: >
          dart format
          $(find . -name '*.dart'
          -not -name '*.freezed.dart'
          -not -name '*.g.dart'
          -not -name '*.gen.dart'
          )

      - name: Suggest changes
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1.26.1
        with:
          fail_level: error
          cleanup: false

      - name: Check diff
        run: git diff --exit-code

  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

  integration-test-ios:
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Update Rust
        run: rustup update

      - name: Start simulator
        uses: futureware-tech/simulator-action@v6
        with:
          model: iPhone 17
          wait_for_boot: true

      - name: Integration test
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: flutter test integration_test/all_tests.dart --ignore-timeouts

  check-i18n-sorting:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Sort i18n files
        run: |
          for file in $(ls lib/i18n/aria/*.i18n.yaml); do
            dart run script/sort_yaml.dart $file
          done

      - name: Suggest changes
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1.26.1
        with:
          fail_level: error
          cleanup: false

      - name: Check diff
        run: git diff --exit-code

  check-build-diff:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Run slang
        run: dart run slang

      - name: Suggest changes
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1.26.1
        with:
          fail_level: error
          cleanup: false

      - name: Check diff
        run: git diff --exit-code
